<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infrastructure Siege — Map</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/map.css" />
  </head>
  <body>
    <main id="map-screen" class="screen map-screen">
      <header class="hud-bar">
        <span class="hud-bar__title">Canberra</span>
        <label class="lobby-size-picker">
          Preview lobby size
          <select id="lobby-size-select"></select>
        </label>
      </header>

      <div id="map-container" class="map-container">
        <svg
          id="map-svg"
          class="map-svg"
          viewBox="0 0 100 100"
          preserveAspectRatio="xMidYMid meet"
          role="application"
          aria-label="Canberra suburb map"
        >
          <g id="map-suburbs"></g>
          <g id="map-data-centers"></g>
          <g id="map-spawns"></g>
        </svg>
        <div id="map-tooltip" class="map-tooltip" hidden></div>
      </div>

      <footer class="map-legend">
        <span class="legend-item"><span class="legend-dot legend-dot--mega"></span>Mega data center</span>
        <span class="legend-item"><span class="legend-dot legend-dot--major"></span>Major data center</span>
        <span class="legend-item"><span class="legend-dot legend-dot--standard"></span>Standard data center</span>
        <span class="legend-item"><span class="legend-dot legend-dot--spawn"></span>Spawn (previewed lobby size)</span>
      </footer>

      <p id="map-attribution" class="map-attribution"></p>
    </main>

    <script type="module" src="/map.js"></script>
  </body>
</html>
