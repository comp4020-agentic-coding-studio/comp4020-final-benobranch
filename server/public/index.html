<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Infrastructure Siege</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="status" class="status" data-state="connecting" role="status">Connecting…</div>

    <main id="join-screen" class="screen">
      <div class="panel">
        <h1>Infrastructure Siege</h1>
        <p class="tagline">A real-time territory game over real Canberra.</p>
        <form id="join-form">
          <label for="name">Callsign</label>
          <input id="name" name="name" maxlength="40" required autocomplete="off" />
          <button type="submit">Join</button>
        </form>
        <p><a href="/readme/">What this app is for →</a></p>
      </div>
    </main>

    <main id="hud-screen" class="screen" hidden>
      <header class="hud-bar">
        <span class="hud-bar__title">Infrastructure Siege</span>
        <span id="player-count" class="hud-bar__count">0 online</span>
      </header>

      <section class="panel">
        <h2>Shared counter</h2>
        <p class="metric"><span id="count">0</span></p>
        <p class="subtle">last bumped by <span id="last-bumped-by">nobody yet</span></p>
        <button id="bump-button">Bump</button>
      </section>

      <section class="panel">
        <h2>Online</h2>
        <ul id="player-list" class="player-list"></ul>
      </section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
